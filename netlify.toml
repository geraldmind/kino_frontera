# Le site est un seul fichier HTML. On le recopie dans public/ au moment du
# build pour garder une seule source de vérité dans le dépôt.
[build]
  command = "mkdir -p public && cp harmonie-guitare.html public/index.html"
  publish = "public"
  functions = "netlify/functions"

# Les fonctions déclarent elles-mêmes leur chemin (/api/grilles), cette
# redirection couvre les versions plus anciennes du runtime.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Les échantillons audio, quand il y en aura : cache long, ils ne changent pas.
[[headers]]
  for = "/samples/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
